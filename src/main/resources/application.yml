spring:
  application:
    name: allocata-core
  config:
    import: optional:file:.env[.properties]
  datasource:
    # prepareThreshold=0 keeps the driver from using server-side prepared
    # statements, which break under PgBouncer transaction pooling.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:6432}/${POSTGRES_DB}?prepareThreshold=0
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 5
  flyway:
    # Migrations bypass PgBouncer and go straight to Postgres, because
    # transaction pooling can split a migration across connections.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_DIRECT_PORT:5432}/${POSTGRES_DB}
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER}
    password: ${RABBITMQ_DEFAULT_PASS}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Local development only: switch to when-authorized before deploying.
      show-details: always
